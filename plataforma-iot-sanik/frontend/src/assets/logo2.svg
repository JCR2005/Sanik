<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">AirSunBox logo mejorado</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Sol con rayos y viento estilizado, nombre AirSunBox</desc>
<defs>
  <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#89D4F5"/>
    <stop offset="100%" style="stop-color:#3A9BD5"/>
  </linearGradient>
  <linearGradient id="windGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#67B7E8;stop-opacity:1"/>
    <stop offset="100%" style="stop-color:#67B7E8;stop-opacity:0.3"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
    <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Grupo del isotipo (Sol y Viento) -->
<g transform="translate(0, -20)">

<!-- Halo sutil alrededor del sol -->
<circle cx="200" cy="155" r="95" fill="#67B7E8" opacity="0.08" style="fill:rgb(103, 183, 232);stroke:none;opacity:0.08;"/>
<circle cx="200" cy="155" r="75" fill="#67B7E8" opacity="0.07" style="fill:rgb(103, 183, 232);stroke:none;opacity:0.07;"/>

<!-- Sol principal con gradiente -->
<circle cx="200" cy="155" r="62" fill="url(#sunGrad)" filter="url(#glow)"/>
<circle cx="200" cy="155" r="62" fill="none" stroke="#67B7E8" stroke-width="2.5"/>

<!-- Rayos cardinales largos -->
<line x1="200" y1="60" x2="200" y2="22" stroke="#67B7E8" stroke-width="3" stroke-linecap="round"/>
<line x1="200" y1="250" x2="200" y2="288" stroke="#67B7E8" stroke-width="3" stroke-linecap="round"/>
<line x1="105" y1="155" x2="67" y2="155" stroke="#67B7E8" stroke-width="3" stroke-linecap="round"/>
<line x1="295" y1="155" x2="333" y2="155" stroke="#67B7E8" stroke-width="3" stroke-linecap="round"/>

<!-- Rayos diagonales largos -->
<line x1="136" y1="91" x2="109" y2="64" stroke="#67B7E8" stroke-width="2.5" stroke-linecap="round"/>
<line x1="264" y1="219" x2="291" y2="246" stroke="#67B7E8" stroke-width="2.5" stroke-linecap="round"/>
<line x1="264" y1="91" x2="291" y2="64" stroke="#67B7E8" stroke-width="2.5" stroke-linecap="round"/>
<line x1="136" y1="219" x2="109" y2="246" stroke="#67B7E8" stroke-width="2.5" stroke-linecap="round"/>

<!-- Rayos secundarios más cortos -->
<line x1="156" y1="69" x2="143" y2="48" stroke="#67B7E8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
<line x1="244" y1="69" x2="257" y2="48" stroke="#67B7E8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
<line x1="156" y1="241" x2="143" y2="262" stroke="#67B7E8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
<line x1="244" y1="241" x2="257" y2="262" stroke="#67B7E8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

<!-- Brillo interno del sol -->
<circle cx="182" cy="138" r="18" fill="white" opacity="0.18"/>

<!-- VIENTO -->
<!-- Viento superior -->
<path d="M348 118 C390 118, 415 118, 448 118 C482 118, 495 82, 468 82 C448 82, 440 100, 452 110 C458 116, 466 118, 468 118" fill="none" stroke="url(#windGrad)" stroke-width="3.5" stroke-linecap="round"/>

<!-- Viento medio -->
<path d="M338 155 C400 155, 448 155, 520 155 C572 155, 585 108, 545 108 C518 108, 510 135, 528 144 C536 149, 544 155, 545 155" fill="none" stroke="#67B7E8" stroke-width="4" stroke-linecap="round"/>

<!-- Viento inferior -->
<path d="M348 192 C400 192, 440 192, 485 192 C522 192, 535 230, 506 230 C484 230, 479 205, 496 198 C502 194, 508 192, 506 192" fill="none" stroke="url(#windGrad)" stroke-width="3.5" stroke-linecap="round"/>

<!-- Viento pequeño secundario -->
<path d="M520 178 C548 178, 556 178, 572 178 C592 178, 598 206, 576 206 C560 206, 556 188, 566 183 C570 180, 575 178, 576 178" fill="none" stroke="#67B7E8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

</g>

<!-- TEXTO PRINCIPAL — Ajustado a y="272" para quedar pegado al viento, con stroke para mayor grosor -->
<text x="338" y="272" font-family="'Syne', 'Arial Black', Arial, sans-serif" font-size="58" font-weight="900" fill="#67B7E8" stroke="#67B7E8" stroke-width="2.2" stroke-linejoin="round" letter-spacing="-1" style="font-family:Syne, 'Arial Black', Arial, sans-serif; font-size:58px; font-weight:900; text-anchor:start; dominant-baseline:auto">AirSunBox</text>

<!-- TAGLINE — Subido a y="296" en perfecta armonía y con mejor legibilidad -->
<text x="340" y="296" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#67B7E8" opacity="0.85" letter-spacing="3" style="font-family:Arial, sans-serif; font-size:13px; font-weight:700; text-anchor:start; dominant-baseline:auto">MONITOREO AMBIENTAL</text>
</svg>
