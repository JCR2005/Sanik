    <stop offset="0%" style="stop-color:#89D4F5"/>
    <stop offset="100%" style="stop-color:#3A9BD5"/>
  </linearGradient>
  <linearGradient id="windGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#67B7E8;stop-opacity:1"/>
    <stop offset="100%" style="stop-color:#67B7E8;stop-opacity:0.3"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
    <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
